    title: "Saurabh Prasad"
    subtitle: >-
      I'm a Professor of Electrical & Computer Engineering and Director of Graduate Studies at the University of Houston, where I direct the Machine Learning and Signal Processing (MLSP) Lab. We build machine learning for geospatial imaging (GeoAI) and biomedicine, with a focus on foundation models, active learning, and multi-sensor image analysis.<br><br>
      **IEEE GRSS Distinguished Lecturer** · 2026 President's Circle Awards Scholar · Area Chair, ICLR and NeurIPS · Organizer, GeoCV @ WACV and MORSE @ CVPR · Funded by NASA, NSF, NIH, DoD and Amazon AWS
